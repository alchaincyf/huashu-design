<!doctype html><html><head><meta charset="utf-8"><title>网格样例</title>
<style>body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#1a2a3a}
.board{display:grid;grid-template-columns:240px 240px;gap:12px;padding:20px;width:520px;overflow:hidden;border-radius:20px}
.cell{width:240px;height:520px}.z{transform:scale(0.62);transform-origin:0 0;width:375px}
.s{position:relative;width:375px;height:812px;overflow:hidden;border-radius:40px}
.cap{position:absolute;top:48px;right:7px;width:87px;height:32px}
</style></head><body><div class="board">
<div class="cell"><div class="z"><div class="s" style="background:#fafaf7" data-mp-page="pages/a/a" data-mp-title="甲" data-mp-nav="default">
 <div class="cap" data-mp-capsule></div><p style="font-size:15px;margin:100px 16px">浅色这一屏</p></div></div></div>
<div class="cell"><div class="z"><div class="s" style="background:#c0392b" data-mp-page="pages/b/b" data-mp-title="乙" data-mp-nav="default">
 <div class="cap" data-mp-capsule></div><p style="font-size:15px;margin:100px 16px;color:#fff">红色这一屏</p></div></div></div>
<div style="grid-column:1/3;color:#fff;font-size:14px">标签：压在下一排的说明文字</div>
</div></body></html>
