name: plugin-marketplace

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  plugin-leaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated plugin leaf must match the Skill SSoT
        run: node scripts/build-plugin-leaf.mjs --check
      - name: Plugin bytes must match their immutable release identity
        run: node scripts/check-plugin-release.mjs
      - name: Plugin marketplace contract tests
        run: node --test test/plugin-marketplace.test.mjs
      - name: Plugin payload must not contain symlinks
        run: |
          set -euo pipefail
          if find "$GITHUB_WORKSPACE/plugins/huashu-design" -type l | grep -q .; then
            echo '::error::plugin payload must not contain symlinks'
            find "$GITHUB_WORKSPACE/plugins/huashu-design" -type l
            exit 1
          fi
      - name: Symlink-disabled checkout still contains a materialized Skill
        run: |
          set -euo pipefail
          git clone -c core.symlinks=false --quiet "$GITHUB_WORKSPACE" /tmp/huashu-design-nosym
          for required in SKILL.md assets/banner.svg scripts/verify.py agents/openai.yaml; do
            test -f "/tmp/huashu-design-nosym/plugins/huashu-design/skills/huashu-design/$required"
          done
          if find /tmp/huashu-design-nosym/plugins/huashu-design -type l | grep -q .; then
            echo '::error::symlink-disabled checkout still has links'
            find /tmp/huashu-design-nosym/plugins/huashu-design -type l
            exit 1
          fi
