.ph{position:absolute;width:340px;height:720px;border-radius:52px;overflow:hidden;box-shadow:0 0 0 9px #000,0 0 0 11px #48494d,0 30px 70px rgba(0,0,0,.45)}

.ph{background:#FFF6E8}
h1{margin:20px 24px 0;font-size:30px;font-weight:800;letter-spacing:-.5px}
.s{margin:2px 24px 0;font-size:14px;color:#8b7a63}
.jar{display:block;margin:6px auto 0}
.say{margin:0 24px;text-align:center;font-size:24px;font-weight:800}
.say small{display:block;font-size:14px;font-weight:500;color:#8b7a63;margin-top:4px}
.cta{position:absolute;left:24px;right:24px;bottom:30px;border-radius:22px;padding:17px;text-align:center;font-weight:800;font-size:18px;color:#FFF6E8;background:#3B2A1A}
.facts{display:flex;gap:8px;margin:16px 24px 0}.facts div{flex:1;background:#F6E7CF;border-radius:14px;padding:10px 12px;font-size:12px;color:#8b7a63}.facts b{display:block;font-size:18px;color:#3B2A1A}
.st{display:flex;align-items:center;gap:14px;padding:12px 22px;border-top:1px solid #EDDCC2}
.st b{font-size:18px;display:block}.st small{font-size:13px;color:#8b7a63}
.key{color:#3B2A1A}
</style></head><body>

<div class="ph" style="left:440px;top:60px;height:640px">

 <h1 style="font-size:24px">它会有的四种样子</h1>

 <div class="st"><svg width="62" height="78" viewBox="-15 -20 230 290"><use href="#jar"/><rect x="23" y="160" width="154" height="77" rx="30" fill="#CFE0EA"/><path d="M70 200 h20M112 200 h20" stroke="#3B2A1A" stroke-width="7" stroke-linecap="round"/><text x="150" y="130" font-size="34" font-weight="800" fill="#3B2A1A">z</text></svg><div><b>冰箱里睡着</b><small>出门一周也没事</small></div></div>

<div class="key"><h2>角色承载状态</h2><p>不画仪表盘。罐子里的面种涨多高、脸上什么表情，就是全部的状态。数字退到下面两格小卡里。</p>
 <div class="l">一个状态一种样子，四种够用</div><div class="l">每种样子配一句该做什么</div><div class="l">角色是数据的脸，不是贴在角落的吉祥物</div>
 <div class="k">先问：这个状态如果是一张脸，它现在什么表情。题材与数据为虚构</div></div>
